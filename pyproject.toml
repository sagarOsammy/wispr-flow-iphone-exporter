[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wispr-flow-iphone-exporter"
version = "0.1.0"
description = "Extract Wispr Flow iPhone transcripts from a local iPhone backup"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE.md" }
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
wispr-flow-iphone-export = "wispr_flow_iphone_exporter.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/wispr_flow_iphone_exporter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
